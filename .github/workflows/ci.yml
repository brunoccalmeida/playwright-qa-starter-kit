name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly run against the live app: the shared environment changes without
  # a commit here (resets, other testers, app releases). 06:23 UTC (03:23 in
  # Brasília), off the top of the hour, when GitHub delays scheduled runs the
  # most. GitHub disables schedules after 60 days without repository activity.
  schedule:
    - cron: '23 6 * * *'

# Least privilege: jobs that need more ask for it explicitly
permissions:
  contents: read

# A new push to a PR supersedes the run of the previous commit. On main a
# running run is never cancelled, so merges and the nightly run take turns;
# GitHub keeps at most one pending run per group, so a pending run is
# replaced by a newer one (which tests a newer main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as local development: one source of truth (.node-version)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # ci, not install: fails if package-lock.json and package.json disagree
      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and format check
        run: npm run check

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # API tests need no browser, so no `playwright install` here.
      # Credentials are secrets in both stores: Actions secrets are not
      # available to workflows triggered by Dependabot, which read Dependabot
      # secrets of the same name instead.
      - name: Run API tests
        run: npm run test:api
        env:
          BASE_URL: https://automationintesting.online
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # One blob per job, named after it: the default name is not
          # guaranteed to differ between jobs, and the report job downloads
          # all blobs into one folder
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-api.zip

      # Even when tests fail: a failing run is the report most worth reading.
      # Holds what the published report shows (no traces, see
      # playwright.config.ts); kept one day, only until the report job runs.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-api
          path: blob-report
          retention-days: 1

  # Runs in the official Playwright image (playwright.dev/docs/ci, "Via
  # Containers"): browsers and their system libraries come baked in, so the
  # job no longer depends on the runner's apt mirror, which once spent the
  # whole timeout on `playwright install --with-deps` (issue #24).
  # The tag must match @playwright/test, or Playwright cannot find the
  # browsers; scripts/check-playwright-image.ts enforces it in `npm run
  # check`. Dependabot does not bump it: when it bumps @playwright/test, set
  # the new tag and its digest here, in that PR. Digest of the multi-arch
  # index (replace the tag in the URL):
  #   curl -sSI -H 'Accept: application/vnd.oci.image.index.v1+json' \
  #     https://mcr.microsoft.com/v2/playwright/manifests/v1.65.1-noble \
  #     | grep -i docker-content-digest
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # --user 1001: as in playwright.dev/docs/ci; the runner's user, which
      # owns the workspace mounted from the host (the image defaults to
      # root). --ipc=host and --init: playwright.dev/docs/docker (Chromium
      # can run out of shared memory; no zombie processes as PID 1).
      options: --user 1001 --ipc=host --init

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image brings Node 24; the project runs on .node-version (26)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser projects depend on setup, which logs in and saves the
      # admin session; same secrets and the same reason as the api job.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: https://automationintesting.online
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-e2e.zip

      # Same as in the api job. The password never reaches a step title
      # (fillSecret); a test that fails mid-login can still print it, in the
      # call log or page snapshot (docs/PROJECT_SESSION_SUMMARY.md, Mission 6).
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-e2e
          path: blob-report
          retention-days: 1

  # Merges the blobs of the test jobs into one HTML report
  # (playwright.dev/docs/test-sharding). Runs on PRs too, so a broken report
  # blocks the merge instead of surfacing on main; its github-pages artifact
  # is the exact site the deploy job would publish.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [api, e2e]
    # A failed test run still produces the report worth publishing
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # A test job that died before writing its blob (timeout, failed image
      # pull) would leave a report of the other layer only, published as
      # if complete. Fail instead: Pages keeps the previous report, which
      # shows its own date, and this run shows why.
      - name: Require a blob from every test job
        run: |
          for blob in report-api.zip report-e2e.zip; do
            test -f "all-blob-reports/$blob" || { echo "::error::Missing $blob: its test job wrote no report"; exit 1; }
          done

      # merge.config.ts, not playwright.config.ts: it only sets testDir (the
      # api and e2e blobs come from different workspace paths, host and
      # container), so this job needs no credentials (playwright.config.ts
      # validates them on import). merge-reports exits 1 when a merged test failed; the test jobs
      # already gate on that. This step fails only if no report was written.
      - name: Merge into the HTML report
        run: |
          npx playwright merge-reports --config merge.config.ts --reporter html ./all-blob-reports || echo "merge-reports exited $? (a merged test failed, or the merge did)"
          test -s playwright-report/index.html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_TITLE: Restful Booker Platform - test report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report

  # Publishes the report of main (each merge and the nightly run) on GitHub
  # Pages; never from a PR. Not in ci-passed: it runs after the merge, so it
  # cannot gate one. Its failure still shows on the run of main.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The workflow group already serializes runs on main; this group also
    # covers any other workflow that deploys to Pages, and never cancels a
    # deployment half-way
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # OSV-Scanner checks package-lock.json against the OSV database, which
  # includes the GitHub Advisory Database behind the Dependabot alerts enabled
  # on this repository. Those alerts watch main daily but block nothing; this
  # job blocks a PR that adds or keeps a known vulnerability, dev dependencies
  # included (they are what this kit runs). It also runs in the nightly run
  # (the whole workflow does). The official reusable workflow, not the scanner
  # action: Google does not support the action on its own. The reporter step
  # fails the job, not the scanner exit code.
  #
  # No SARIF upload: the Dependabot alerts already list these advisories under
  # Security, and on a PR from a fork the read-only token would fail the
  # upload. The called job still declares security-events: write, and a
  # called workflow cannot get more than the caller grants, so it stays here.
  # A job that calls a workflow takes no timeout-minutes.
  #
  # Policy: any known vulnerability fails the job. When a patched version
  # exists, pin it in "overrides"; never `npm audit fix --force` (it can
  # downgrade a major) nor continue-on-error. Only when no fix is published,
  # a time-boxed exception in osv-scanner.toml (rules in that file).
  audit:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      upload-sarif: false
      scan-args: |-
        --lockfile=package-lock.json

  # The core's enforcement from automation-template (UTF-8 text, secret
  # scan with gitleaks, workflow audit with zizmor), as a reusable workflow
  # the template owns and copier update keeps current: change it in the
  # template, not here. A called workflow's job succeeds only when all of its
  # jobs do. $/: this repository at the running commit, with no checkout
  # (GitHub Docs, "Workflow syntax", uses); zizmor flags "./"
  # (self-repository). GitHub secret scanning (enabled on this repository)
  # still watches every branch for known provider tokens.
  core-checks:
    uses: $/.github/workflows/core-checks.yml
    permissions:
      contents: read

  # The single required check of the ruleset on main. Requiring each job by
  # name would mean editing the ruleset whenever a job is added or renamed
  # (matrix jobs are named after their values); this job's name never changes.
  # always(): a required check that is skipped counts as passed, so the gate
  # must run, and fail, when a dependency fails or is cancelled.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [core-checks, check, api, e2e, audit, report]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job missing from "needs" would not gate the merge. Compare the
      # jobs this gate waited for with every other job of this workflow,
      # except deploy: it never runs on a PR, so it cannot gate a merge.
      - name: Require the gate to need every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          expected=$(yq -o=json '.jobs | keys | map(select(. != "ci-passed" and . != "deploy")) | sort' .github/workflows/ci.yml | jq -c .)
          actual=$(jq -c 'keys | sort' <<< "$NEEDS")
          echo "workflow jobs: $expected"
          echo "gate needs:    $actual"
          test "$expected" = "$actual"

      # Allowlist: only an explicit "success" passes; failure, cancelled and
      # skipped all fail, because a skipped job tested nothing.
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
