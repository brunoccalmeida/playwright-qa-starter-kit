name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs that need more ask for it explicitly
permissions:
  contents: read

# A new push to a PR supersedes the run of the previous commit. Runs on main
# are never cancelled: each merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as local development: one source of truth (.node-version)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # ci, not install: fails if package-lock.json and package.json disagree
      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and format check
        run: npm run check

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # API tests need no browser, so no `playwright install` here.
      # Credentials are secrets in both stores: Actions secrets are not
      # available to workflows triggered by Dependabot, which read Dependabot
      # secrets of the same name instead.
      - name: Run API tests
        run: npm run test:api
        env:
          BASE_URL: https://automationintesting.online
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # No test-results artifact: traces are off in CI because they would
      # store the credentials in plain text (see playwright.config.ts).

  # npm audit queries the GitHub Advisory Database, the same source as the
  # Dependabot alerts enabled on this repository. Those alerts watch main
  # daily but block nothing; this job blocks a PR that adds or keeps a known
  # vulnerability. No schedule here for the same reason: the alerts already
  # cover new advisories between PRs.
  #
  # Policy: any known vulnerability fails the job (the default audit-level).
  # To fix a transitive one, pin the patched version in "overrides"; never
  # `npm audit fix --force` (it can downgrade a major) nor continue-on-error.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache and no install: npm audit reads package-lock.json, so it
      # audits exactly what `npm ci` would install, dev dependencies included
      # (they are what this kit runs).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Audit dependencies
        run: npm audit

  # The single required check of the ruleset on main. Requiring each job by
  # name would mean editing the ruleset whenever a job is added or renamed
  # (matrix jobs are named after their values); this job's name never changes.
  # always(): a required check that is skipped counts as passed, so the gate
  # must run, and fail, when a dependency fails or is cancelled.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, api, audit]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job missing from "needs" would not gate the merge. Compare the
      # jobs this gate waited for with every other job of this workflow.
      - name: Require the gate to need every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          expected=$(yq -o=json '.jobs | keys | map(select(. != "ci-passed")) | sort' .github/workflows/ci.yml | jq -c .)
          actual=$(jq -c 'keys | sort' <<< "$NEEDS")
          echo "workflow jobs: $expected"
          echo "gate needs:    $actual"
          test "$expected" = "$actual"

      # Allowlist: only an explicit "success" passes; failure, cancelled and
      # skipped all fail, because a skipped job tested nothing.
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
