name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly run against the live app: the shared environment changes without
  # a commit here (resets, other testers, app releases). 06:23 UTC (03:23 in
  # Brasília), off the top of the hour, when GitHub delays scheduled runs the
  # most. GitHub disables schedules after 60 days without repository activity.
  schedule:
    - cron: '23 6 * * *'

# Least privilege: jobs that need more ask for it explicitly
permissions:
  contents: read

# A new push to a PR supersedes the run of the previous commit. On main a
# running run is never cancelled, so merges and the nightly run take turns;
# GitHub keeps at most one pending run per group, so a pending run is
# replaced by a newer one (which tests a newer main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as local development: one source of truth (.node-version)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # ci, not install: fails if package-lock.json and package.json disagree
      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and format check
        run: npm run check

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # API tests need no browser, so no `playwright install` here.
      # Credentials are secrets in both stores: Actions secrets are not
      # available to workflows triggered by Dependabot, which read Dependabot
      # secrets of the same name instead.
      - name: Run API tests
        run: npm run test:api
        env:
          BASE_URL: https://automationintesting.online
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # One blob per job, named after it: the default name is not
          # guaranteed to differ between jobs, and the report job downloads
          # all blobs into one folder
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-api.zip

      # Even when tests fail: a failing run is the report most worth reading.
      # Holds what the published report shows (no traces, see
      # playwright.config.ts); kept one day, only until the report job runs.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-api
          path: blob-report
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser cache: playwright.dev/docs/ci says restoring it takes about
      # as long as downloading the binaries. Only the browsers the tests use.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      # The browser projects depend on setup, which logs in and saves the
      # admin session; same secrets and the same reason as the api job.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: https://automationintesting.online
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-e2e.zip

      # Same as in the api job. The password never reaches a step title
      # (fillSecret); a test that fails mid-login can still print it, in the
      # call log or page snapshot (docs/PROJECT_SESSION_SUMMARY.md, Mission 6).
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-e2e
          path: blob-report
          retention-days: 1

  # Merges the blobs of the test jobs into one HTML report
  # (playwright.dev/docs/test-sharding). Runs on PRs too, so a broken report
  # blocks the merge instead of surfacing on main; its github-pages artifact
  # is the exact site the deploy job would publish.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [api, e2e]
    # A failed test run still produces the report worth publishing
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # A test job that died before writing its blob (timeout, failed browser
      # install) would leave a report of the other layer only, published as
      # if complete. Fail instead: Pages keeps the previous report, which
      # shows its own date, and this run shows why.
      - name: Require a blob from every test job
        run: |
          for blob in report-api.zip report-e2e.zip; do
            test -f "all-blob-reports/$blob" || { echo "::error::Missing $blob: its test job wrote no report"; exit 1; }
          done

      # No --config: merge-reports then loads an empty config, so this job
      # needs no credentials (playwright.config.ts validates them on import).
      # merge-reports exits 1 when a merged test failed; the test jobs
      # already gate on that. This step fails only if no report was written.
      - name: Merge into the HTML report
        run: |
          npx playwright merge-reports --reporter html ./all-blob-reports || echo "merge-reports exited $? (a merged test failed, or the merge did)"
          test -s playwright-report/index.html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_TITLE: Restful Booker Platform - test report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report

  # Publishes the report of main (each merge and the nightly run) on GitHub
  # Pages; never from a PR. Not in ci-passed: it runs after the merge, so it
  # cannot gate one. Its failure still shows on the run of main.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The workflow group already serializes runs on main; this group also
    # covers any other workflow that deploys to Pages, and never cancels a
    # deployment half-way
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # npm audit queries the GitHub Advisory Database, the same source as the
  # Dependabot alerts enabled on this repository. Those alerts watch main
  # daily but block nothing; this job blocks a PR that adds or keeps a known
  # vulnerability. It also runs in the nightly run (the whole workflow does),
  # which only repeats what the alerts already report between PRs.
  #
  # Policy: any known vulnerability fails the job (the default audit-level).
  # To fix a transitive one, pin the patched version in "overrides"; never
  # `npm audit fix --force` (it can downgrade a major) nor continue-on-error.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache and no install: npm audit reads package-lock.json, so it
      # audits exactly what `npm ci` would install, dev dependencies included
      # (they are what this kit runs).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Audit dependencies
        run: npm audit

  # Secret scanning with gitleaks over the history of the tested commit (on a
  # PR, the merge commit: what main would become). A key pushed to a public
  # repository is leaked even if a later commit deletes it, so every commit
  # is scanned, not only the last diff. No gitleaks-action: its licence
  # requires a paid key for organizations, which is where this kit is used.
  # The release is pinned by version and SHA-256 (from the release's
  # checksums file); Dependabot does not track it, so bump both by hand.
  #
  # Triage a false positive with a `gitleaks:allow` comment on the line or
  # its fingerprint in .gitleaksignore; a real secret is rotated first, then
  # removed. --redact keeps a found secret out of this public run's log.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth 0: the default shallow clone holds one commit, so a
      # secret added and deleted within a PR would go unseen
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Exits 1 on any leak
      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  # Security audit of the workflows with zizmor (docs.zizmor.sh): template
  # injection, excessive permissions, persisted credentials and, since
  # zizmor 1.20, any action not pinned by full commit SHA. The regular
  # persona (the default, meant for CI) has no findings here; pedantic only
  # asks for job names, and auditor flags the demo credentials outside a
  # GitHub environment (docs/PROJECT_SESSION_SUMMARY.md, issue #31).
  # Ignore a finding only inline, with a reason: `# zizmor: ignore[rule]`.
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advanced-security: false prints the findings and fails the job;
      # true would upload SARIF to code scanning and always pass, which
      # ci-passed could not see. version is pinned (default: latest) so a
      # new zizmor release cannot fail a PR that changed nothing; Dependabot
      # bumps the action, not this input, so bump it by hand.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: 1.32.0

  # The single required check of the ruleset on main. Requiring each job by
  # name would mean editing the ruleset whenever a job is added or renamed
  # (matrix jobs are named after their values); this job's name never changes.
  # always(): a required check that is skipped counts as passed, so the gate
  # must run, and fail, when a dependency fails or is cancelled.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, api, e2e, audit, report, secret-scan, workflow-audit]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job missing from "needs" would not gate the merge. Compare the
      # jobs this gate waited for with every other job of this workflow,
      # except deploy: it never runs on a PR, so it cannot gate a merge.
      - name: Require the gate to need every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          expected=$(yq -o=json '.jobs | keys | map(select(. != "ci-passed" and . != "deploy")) | sort' .github/workflows/ci.yml | jq -c .)
          actual=$(jq -c 'keys | sort' <<< "$NEEDS")
          echo "workflow jobs: $expected"
          echo "gate needs:    $actual"
          test "$expected" = "$actual"

      # Allowlist: only an explicit "success" passes; failure, cancelled and
      # skipped all fail, because a skipped job tested nothing.
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
