name: Core checks

# The enforcement every project gets from the core
# (https://github.com/brunoccalmeida/automation-template/issues/71), as a reusable
# workflow: the project's CI calls it as one job in the needs of its gate,
# so a failure here fails the single check the ruleset requires. It is
# template-owned and updated by copier update; the calling workflow belongs
# to the project, which adds its own jobs there. The jobs name no stack
# (https://github.com/brunoccalmeida/automation-template/blob/main/docs/adr/0003-stack-agnostic-core-defines-contracts.md).
# No concurrency here: when called, github.workflow is the
# caller's name, so a group here could cancel the caller itself.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Every tracked text file is UTF-8: a UTF-16 file (Windows PowerShell 5.1
  # Out-File) is stored by Git as binary and silently ignored by the tool
  # that reads it (https://github.com/brunoccalmeida/uat-automation-framework/issues/26).
  # The script's header lists what it checks.
  text-encoding:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that text files are UTF-8
        run: sh .github/scripts/check-text-encoding.sh

  # Secret scanning with gitleaks over the history of the tested commit (on a
  # PR, the merge commit: what the main branch would become). A key pushed to
  # a public repository is leaked even if a later commit deletes it, so every
  # commit is scanned, not only the last diff. The binary, not gitleaks-action:
  # the action needs a licence key for repositories of an organization
  # (gitleaks-action README), and the scanner is MIT and needs none. The
  # release is pinned by version and SHA-256 (from the release's checksums
  # file); Dependabot does not track it, so bump both by hand.
  #
  # Triage a false positive with a `gitleaks:allow` comment on the line. A
  # fingerprint in .gitleaksignore embeds the commit SHA, so use it only for
  # a commit already on the main branch: a squash merge gives a PR's commits
  # new SHAs. A real secret is rotated first, then removed. --redact keeps a
  # found secret out of the run's log.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth 0: the default shallow clone holds one commit, so a
      # secret added and deleted within a PR would go unseen
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # --log-opts=HEAD: without it gitleaks runs `git log --all`, and with
      # fetch-depth 0 a secret on any other branch would fail every PR. This
      # check judges what the main branch would contain. Exits 1 on any leak.
      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --verbose .'

  # Security audit of the workflows, composite actions and dependabot.yml with
  # zizmor (docs.zizmor.sh; run it locally on ".", the same scope): template
  # injection, excessive permissions, persisted credentials, Dependabot
  # cooldown and, since zizmor 1.20, any action not pinned by full commit SHA,
  # first-party actions included (audit unpinned-uses, default policy
  # "*": hash-pin), so no pinning test of our own is needed. Regular persona
  # (the default); ignore a finding only inline, with a reason:
  # `# zizmor: ignore[rule]`.
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advanced-security: false prints the findings and fails the job; true
      # would upload SARIF to code scanning and always pass, which the gate
      # could not see. version is pinned (default: latest) so a new zizmor
      # release cannot fail a PR that changed nothing; Dependabot bumps the
      # action, not this input, so bump it by hand.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: 1.32.0
